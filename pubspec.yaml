name: cubix_blast
description: "CubixBlast: Puzzle Game - Two game modes: Classic blocks and Arena sand physics"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  audio_session: ^0.2.3
  audioplayers: ^6.7.1
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  nearby_connections: ^4.3.0
  nowplaying:
    path: packages/nowplaying
  palette_generator: ^0.3.3+7
  permission_handler: ^12.0.3
  share_plus: ^13.1.0
  shared_preferences: ^2.5.5
  # ─── Multijugador Online (PvP 1v1) ───
  firebase_core: ^3.8.0
  firebase_database: ^11.1.7
  flutter_webrtc: ^1.5.0
  uuid: ^4.5.1
  app_links: ^7.1.2
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
